name: nutrileaf
description: "Smart Plant Nutrition Diagnosis - Detect plant nutrient deficiencies using the HHC-VNDC AI pipeline"
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.0.7
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  # image package used by ImageValidator for resolution checking and leaf-content heuristic
  image: ^4.1.4
  path_provider: ^2.1.2
  intl: ^0.19.0
  uuid: ^4.3.3
  animated_text_kit: ^4.2.2
  # http used by HhcApiService for multipart POST to the HHC-VNDC backend
  http: ^1.2.1
  camera: ^0.10.5+9
  supabase_flutter: ^2.17.1
  google_sign_in: ^7.2.0
  flutter_dotenv: ^5.2.1
  http_parser: ^4.1.2
  # flutter_onnxruntime REMOVED — all inference is now server-side via HhcApiService

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/nutrileaf_app_icon.png"
  remove_alpha_ios: true